[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-latchpoint"
version = "0.1.1"
description = "Offline-first auditor for MCP client configuration files"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Robert Vind-Gardoș" }]
keywords = ["mcp", "security", "configuration", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/robyroro/mcp-latchpoint"
Issues = "https://github.com/robyroro/mcp-latchpoint/issues"
Changelog = "https://github.com/robyroro/mcp-latchpoint/blob/main/CHANGELOG.md"

[project.scripts]
mcp-latchpoint = "mcp_latchpoint.cli:main"
mcp-latchpoint-server = "mcp_latchpoint.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_latchpoint"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_latchpoint"]
